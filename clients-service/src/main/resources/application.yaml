spring:
  application:
    name: clients-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clients_db}
    username: ${DB_USERNAME:clients_user}
    password: ${DB_PASSWORD:clients_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:bank}
    password: ${RABBITMQ_PASSWORD:bank}
    connection-timeout: 5s
    # The outbox relay waits for broker confirms before marking events as published (ADR-009)
    publisher-confirm-type: simple

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  outbox:
    poll-interval-ms: 1000
    batch-size: 100
    confirm-timeout: 5s

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
