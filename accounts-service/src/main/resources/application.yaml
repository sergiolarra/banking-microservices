spring:
  application:
    name: accounts-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${DB_USERNAME:accounts_user}
    password: ${DB_PASSWORD:accounts_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:bank}
    password: ${RABBITMQ_PASSWORD:bank}
    connection-timeout: 5s
    listener:
      simple:
        # A message that still fails after 3 retries (1 s, 2 s, 4 s) goes to the DLQ (ADR-010)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Days of the account statement are interpreted in this zone (ADR-021)
  time-zone: America/Guayaquil

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
