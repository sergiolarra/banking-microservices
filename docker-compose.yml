# The whole system (F7): `docker compose up -d --build --wait`.
# Default credentials are for local development only; override them with a .env file.
name: banking-microservices

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CLIENTS_DB_PASSWORD: ${CLIENTS_DB_PASSWORD:-clients_pass}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bank}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bank}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clients-service:
    build: ./clients-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clients_db
      DB_USERNAME: clients_user
      DB_PASSWORD: ${CLIENTS_DB_PASSWORD:-clients_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-bank}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bank}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  accounts-service:
    build: ./accounts-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/accounts_db
      DB_USERNAME: accounts_user
      DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-bank}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-bank}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
