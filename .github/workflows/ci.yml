name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [clients-service, accounts-service]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Unit tests, Testcontainers integration tests, ArchUnit and the JaCoCo gate (ADR-025)
      - name: Build, test and check coverage
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage — ${{ matrix.service }}"
            echo ""
            echo "| Service | Lines (min 80 %) | Branches (min 70 %) |"
            echo "|---------|------------------|---------------------|"
            .github/scripts/coverage-summary.sh "${{ matrix.service }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/site/jacoco/
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  # F7: builds the real images, starts the whole system and runs the Postman collection (ADR-025)
  docker-e2e:
    name: docker-e2e
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Check that database.sql matches the migrations
        run: |
          scripts/build-database-sql.sh
          git diff --exit-code database.sql

      - name: Build and start the system
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run the Postman collection
        run: >
          npx --yes newman@6.2.3 run postman/banking-microservices.postman_collection.json
          -e postman/local.postman_environment.json
          --reporters cli,junit --reporter-junit-export newman/results.xml

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-results
          path: newman/results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the system
        if: always()
        run: docker compose down -v
