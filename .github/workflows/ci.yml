name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [clients-service, accounts-service]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Unit tests, Testcontainers integration tests, ArchUnit and the JaCoCo gate (ADR-025)
      - name: Build, test and check coverage
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage — ${{ matrix.service }}"
            echo ""
            echo "| Service | Lines (min 80 %) | Branches (min 70 %) |"
            echo "|---------|------------------|---------------------|"
            .github/scripts/coverage-summary.sh "${{ matrix.service }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/site/jacoco/
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
