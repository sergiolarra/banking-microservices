version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directories:
      - /clients-service
      - /accounts-service
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      maven-dependencies:
        patterns: ["*"]
